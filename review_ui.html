<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>simsa — 심사 검토</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Pretendard','-apple-system','sans-serif']}}}}</script>
<style>
:root{
  --surface-0:#F5F5F3;--surface-1:#EFEEEB;--surface-2:#FFFFFF;--surface-3:#FFFFFF;
  --text-primary:#1C1B1A;--text-secondary:#6B6A66;--text-muted:#9A9992;
  --border:#E4E3DF;--border-strong:#D3D2CC;
  --fill-accent:#3B82F6;--fill-accent-hover:#2563EB;--bg-accent:#EAF2FE;--border-accent:#93C5FD;--text-accent:#2563EB;--on-accent:#FFFFFF;
  --fill-danger:#E5484D;--bg-danger:#FDECEC;--border-danger:#F3A9AC;--text-danger:#C81E27;--on-danger:#FFFFFF;
  --fill-success:#1F9254;--bg-success:#E6F4EC;--border-success:#8FCFAE;--text-success:#16794A;--on-success:#FFFFFF;
  --fill-warning:#E9A23B;--bg-warning:#FDF3E1;--border-warning:#F3CD8E;--text-warning:#92620F;--on-warning:#2B1B02;
  --fill-pro:#7C5CE0;--bg-pro:#F0ECFC;--border-pro:#C7B7F1;--text-pro:#5E3FC2;--on-pro:#FFFFFF;
  --radius:8px;
}
@media (prefers-color-scheme: dark){:root{
  --surface-0:#171614;--surface-1:#201F1C;--surface-2:#2A2926;--surface-3:#333230;
  --text-primary:#F2F1ED;--text-secondary:#B6B4AD;--text-muted:#837F76;
  --border:#3A3833;--border-strong:#4A473F;
  --fill-accent:#5B9BF7;--fill-accent-hover:#79AEF9;--bg-accent:#1C2C46;--border-accent:#3E63A0;--text-accent:#8FC0FB;--on-accent:#0B1220;
  --fill-danger:#F17075;--bg-danger:#3B1E1F;--border-danger:#7A3639;--text-danger:#FCA5A8;--on-danger:#250A0B;
  --fill-success:#48C083;--bg-success:#163625;--border-success:#2E6B49;--text-success:#86E3B5;--on-success:#08140D;
  --fill-warning:#F0B65D;--bg-warning:#3A2C10;--border-warning:#7A5B20;--text-warning:#F6CE8F;--on-warning:#2B1D06;
  --fill-pro:#9E85EC;--bg-pro:#2B2148;--border-pro:#5B4791;--text-pro:#C4B3F5;--on-pro:#16102B;
}}
body{font-family:Pretendard,-apple-system,sans-serif;background:var(--surface-0);color:var(--text-primary)}
.dbox{position:absolute;border:2px solid var(--border-danger);border-radius:4px;cursor:pointer}
.dbox.correct{border-color:var(--border-success)}.dbox.wrong{border-color:var(--border-strong);border-style:dashed}
.dbox .tag{position:absolute;top:-22px;left:-2px;background:var(--bg-danger);color:var(--text-danger);font-size:11px;font-weight:500;padding:2px 7px;border-radius:6px;white-space:nowrap}
.dbox.correct .tag{background:var(--bg-success);color:var(--text-success)}.dbox.wrong .tag{background:var(--surface-1);color:var(--text-muted)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
</style></head>
<body class="antialiased">
<header class="bg-[var(--surface-2)] sticky top-0 z-20 border-b border-[var(--border)]">
  <div class="max-w-[1280px] mx-auto px-6 h-16 flex items-center gap-4">
    <a href="#home" class="text-[21px] font-medium tracking-tight">simsa<span class="text-[var(--text-accent)]">.</span></a>
    <span id="crumb" class="text-[13px] text-[var(--text-muted)] truncate"></span>
    <nav class="ml-auto flex gap-1 shrink-0">
      <a href="#home" class="px-4 py-2 rounded-full text-[13px] font-medium text-[var(--text-secondary)] hover:bg-[var(--surface-1)]">홈</a>
      <a href="#golden" class="px-4 py-2 rounded-full text-[13px] font-medium text-[var(--text-secondary)] hover:bg-[var(--surface-1)]">골든셋 검사</a>
    </nav>
  </div>
</header>
<main id="main" class="max-w-[1280px] mx-auto px-6 py-8"></main>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(url,opt)=>{const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r.json()};
let pollTimer=null;

const BTN='px-4 py-2.5 rounded-xl text-[13px] font-medium transition active:scale-[0.98] disabled:opacity-40';
const P=`${BTN} bg-[var(--fill-accent)] text-[var(--on-accent)] hover:bg-[var(--fill-accent-hover)]`;
const G=`${BTN} bg-[var(--surface-1)] text-[var(--text-secondary)] hover:bg-[var(--border)]`;
const SM='px-3 py-1.5 rounded-lg text-[12px] font-medium transition active:scale-[0.97]';
const PS=`${SM} bg-[var(--fill-accent)] text-[var(--on-accent)]`;
const GS=`${SM} bg-[var(--surface-1)] text-[var(--text-secondary)] hover:bg-[var(--border)]`;
const INP='w-full px-3.5 py-2.5 rounded-xl border border-[var(--border)] text-[14px] bg-[var(--surface-2)] text-[var(--text-primary)] focus:outline-none focus:border-[var(--border-accent)] focus:ring-2 focus:ring-[var(--border-accent)]/30';
const card=(inner,extra='')=>`<div class="bg-[var(--surface-2)] rounded-[16px] p-6 border border-[var(--border)] ${extra}">${inner}</div>`;
const h2=t=>`<h2 class="text-[17px] font-medium mb-1.5 flex items-center gap-2 flex-wrap">${t}</h2>`;
const hint=t=>`<p class="text-[13px] text-[var(--text-muted)] leading-relaxed mb-4">${t}</p>`;

const BADGE={pass:'bg-[var(--bg-success)] text-[var(--text-success)]',detected:'bg-[var(--bg-success)] text-[var(--text-success)]',ready:'bg-[var(--bg-success)] text-[var(--text-success)]',done:'bg-[var(--bg-success)] text-[var(--text-success)]',
fail:'bg-[var(--bg-danger)] text-[var(--text-danger)]',error:'bg-[var(--bg-danger)] text-[var(--text-danger)]',
uncertain:'bg-[var(--bg-warning)] text-[var(--text-warning)]',
processing:'bg-[var(--bg-accent)] text-[var(--text-accent)]',running:'bg-[var(--bg-accent)] text-[var(--text-accent)]',pending:'bg-[var(--bg-accent)] text-[var(--text-accent)]',
skipped:'bg-[var(--surface-1)] text-[var(--text-muted)]',golden:'bg-[var(--bg-pro)] text-[var(--text-pro)]'};
const badge=(t,k)=>`<span class="inline-flex px-2.5 py-1 rounded-full text-[11px] font-medium leading-none ${BADGE[k]||BADGE.skipped}">${esc(t)}</span>`;

const durS=t=>Array.isArray(t)&&t.length===2?Math.max(0,t[1]-t[0]):null;
const fmtD=s=>s==null?'':(s<1?Math.round(s*1000)+'ms':s<60?s.toFixed(1)+'초':Math.floor(s/60)+'분 '+Math.round(s%60)+'초');

const NODE={done:'border-[var(--border-success)]/60 bg-[var(--bg-success)] text-[var(--text-success)]',running:'border-[var(--border-accent)] bg-[var(--bg-accent)] text-[var(--text-accent)] animate-pulse',
error:'border-[var(--border-danger)]/60 bg-[var(--bg-danger)] text-[var(--text-danger)]',pending:'border-[var(--border)] bg-[var(--surface-2)] text-[var(--text-muted)]',skipped:'border-[var(--border)] bg-[var(--surface-1)] text-[var(--text-muted)]'};
const dagNode=(label,state,sub)=>`<div class="flex flex-col items-center justify-center px-3 py-1.5 rounded-xl border ${NODE[state]||NODE.pending} min-w-[80px]">
  <span class="text-[12px] font-medium leading-tight whitespace-nowrap">${esc(label)}</span>
  <span class="text-[10.5px] opacity-80 leading-tight h-[13px]">${esc(sub||'')}</span></div>`;
const dagArrow='<svg width="24" height="8" class="shrink-0 text-[var(--border-strong)] mx-0.5"><line x1="0" y1="4" x2="16" y2="4" stroke="currentColor" stroke-width="1.5"/><path d="M16 0.5 L23 4 L16 7.5 Z" fill="currentColor"/></svg>';
const dag=nodes=>`<div class="flex items-center flex-wrap gap-y-2">${nodes.join(dagArrow)}</div>`;

function fileDag(f){
  const t=f.timings||{};
  if(f.status==='skipped')return dag([dagNode('변환','done',''),dagNode('원본 보존','skipped','')]);
  const detState=f.status==='detected'?'done':f.status==='error'?'error':'running';
  return dag([
    dagNode('변환','done',''),
    dagNode('렌더',t.render?'done':(detState==='running'?'running':'skipped'),t.render?fmtD(durS(t.render)):'캐시'),
    dagNode('VLM 탐지',detState,t.detect?fmtD(durS(t.detect)):''),
    dagNode(f.status==='error'?'오류':'검토 대기',detState,'')
  ]);
}

function subFlow(d){
  const t=d.timings||{};
  const act=d.files.filter(f=>f.status!=='skipped');
  const done=act.filter(f=>f.status==='detected').length;
  const detS=d.status==='processing'?'running':act.some(f=>f.status==='error')?'error':act.length&&done===act.length?'done':act.length?'running':'pending';
  return dag([
    dagNode('업로드','done',''),
    dagNode('문서 변환',t.convert?'done':(d.status==='processing'?'running':'pending'),fmtD(durS(t.convert))),
    dagNode('파일 탐지 (flash)',detS,act.length?`${done}/${act.length} 파일`:''),
    dagNode('종합 검사 (pro)',t.checks?'done':(d.status==='processing'?'pending':(d.checks&&d.checks.length?'done':'pending')),fmtD(durS(t.checks)))
  ]);
}

function gantt(d){
  const t=d.timings||{};let origin=Infinity,end=0;
  const track=a=>{if(Array.isArray(a)&&a.length===2){origin=Math.min(origin,a[0]);end=Math.max(end,a[1])}};
  track(t.convert);track(t.checks);
  d.files.forEach(f=>{const ft=f.timings||{};track(ft.render);track(ft.detect)});
  if(!isFinite(origin)||end<=origin)return '';
  const span=end-origin;
  const bar=(a,c,tip)=>Array.isArray(a)&&a.length===2?`<div class="absolute h-full rounded-full ${c}" title="${esc(tip||'')}" style="left:${((a[0]-origin)/span*100).toFixed(2)}%;width:${Math.max((a[1]-a[0])/span*100,0.9).toFixed(2)}%"></div>`:'';
  const row=(label,bars,dur)=>`<div class="flex items-center gap-3 py-[3px]">
    <span class="w-52 shrink-0 truncate text-[12px] text-[var(--text-secondary)] text-right" title="${esc(label)}">${esc(label)}</span>
    <div class="relative flex-1 h-3.5 bg-[var(--surface-1)] rounded-full overflow-hidden">${bars}</div>
    <span class="w-16 shrink-0 text-[11px] text-[var(--text-muted)]">${dur||''}</span></div>`;
  const rows=[row('문서 변환',bar(t.convert,'bg-[var(--text-muted)]','변환'),fmtD(durS(t.convert)))];
  d.files.filter(f=>f.status!=='skipped').forEach(f=>{const ft=f.timings||{};
    const total=(durS(ft.render)||0)+(durS(ft.detect)||0);
    rows.push(row(f.filename,bar(ft.render,'bg-[var(--fill-warning)]','렌더')+bar(ft.detect,'bg-[var(--fill-accent)]','VLM 탐지'),total?fmtD(total):''));});
  rows.push(row('종합 검사 (pro)',bar(t.checks,'bg-[var(--fill-pro)]','종합 검사'),fmtD(durS(t.checks))));
  const leg=(c,t2)=>`<span class="inline-flex items-center gap-1.5 text-[11px] text-[var(--text-muted)]"><span class="w-2.5 h-2.5 rounded ${c}"></span>${t2}</span>`;
  return card(h2('처리 타임라인')+
    `<div class="flex gap-4 mb-3">${leg('bg-[var(--text-muted)]','변환')}${leg('bg-[var(--fill-warning)]','렌더')}${leg('bg-[var(--fill-accent)]','VLM 탐지')}${leg('bg-[var(--fill-pro)]','종합 검사')}</div>`+
    rows.join('')+
    `<div class="flex justify-between pl-[220px] pr-[76px] text-[10px] text-[var(--text-muted)] mt-1.5"><span>0초</span><span>${fmtD(span)}</span></div>`,'mb-5');
}

function route(){clearInterval(pollTimer);const h=location.hash||'#home';
  if(h.startsWith('#sub/'))return viewSubmission(+h.slice(5));
  if(h.startsWith('#file/'))return viewFile(+h.slice(6));
  if(h.startsWith('#onboard/'))return viewOnboard(+h.slice(9));
  if(h==='#golden')return viewGolden();
  viewHome()}
window.addEventListener('hashchange',route);

let CURPACK=null;
async function viewHome(){$('#crumb').textContent='';
  const d=await api('/api/bootstrap');
  const pack=d.packs.find(p=>p.id===CURPACK)||d.packs[0];CURPACK=pack.id;
  const onb=pack.status==='onboarding';
  const fileRules=pack.rules.filter(r=>r.scope==='file'),subRules=pack.rules.filter(r=>r.scope==='submission');
  $('#main').innerHTML=`
  <div class="flex items-center gap-2.5 mb-5 flex-wrap">
    <select id="packsel" class="${INP} !w-[280px]">${d.packs.map(p=>`<option value="${p.id}" ${p.id===pack.id?'selected':''}>${esc(p.name)}${p.status==='onboarding'?' — 온보딩 중':''}</option>`).join('')}</select>
    ${onb?`<a href="#onboard/${pack.id}" class="${PS} no-underline">온보딩 이어하기</a>`:''}
    <button class="${GS}" onclick="newPack()">+ 새 심사 팩 만들기</button>
  </div>
  <div class="grid lg:grid-cols-[420px_1fr] gap-5 items-start">
  <section class="space-y-5">
    ${card(h2('제출건 업로드')+
      (onb?`<p class="text-[13px] text-[var(--text-warning)] font-medium bg-[var(--bg-warning)]/60 rounded-xl p-3">이 팩은 아직 온보딩 중이에요. <a href="#onboard/${pack.id}" class="underline">서류 집합·규칙을 확정</a>해야 심사를 시작할 수 있어요.</p>`:'')+
      `<form id="upform" class="space-y-3 ${onb?'opacity-40 pointer-events-none':''}">
      <input type="hidden" name="pack_id" value="${pack.id}">
      <div><label class="block text-[13px] font-medium text-[var(--text-secondary)] mb-1.5">심사 기준일 <span class="text-[var(--text-danger)]">*</span></label>
        <input type="date" name="base_date" id="basedate" class="${INP}" required>
        <p class="text-[12px] text-[var(--text-muted)] mt-1.5">발급일 3개월 이내 같은 <b class="font-medium">모든 날짜 판정의 기준</b>이 되는 날짜예요.</p></div>
      <div><label class="block text-[13px] font-medium text-[var(--text-secondary)] mb-1.5">제출 ZIP</label>
        <input name="zip" type="file" accept=".zip" required class="block w-full text-[13px] text-[var(--text-secondary)] file:mr-3 file:px-4 file:py-2.5 file:rounded-xl file:border-0 file:bg-[var(--bg-accent)] file:text-[var(--text-accent)] file:text-[13px] file:font-medium file:cursor-pointer"></div>
      <button class="${P} w-full py-3">업로드하고 탐지 시작</button>
      <p class="text-[12px] text-[var(--text-muted)]">같은 파일 + 같은 규칙이면 캐시를 써서 API 호출이 없어요.</p></form>`)}
    ${card(h2('제출건')+`<div id="subs" class="space-y-2.5">불러오는 중…</div>`)}
  </section>
  <section class="space-y-5">
    ${card(h2('문서 유형 레지스트리 — '+esc(pack.name))+
      hint('"어떤 서류가 들어와야 하는가"의 기준. 내용 기반 VLM 판별이 주, 파일명 힌트는 보조예요. 버튼으로 필수↔선택을 바꿀 수 있어요.')+
      `<div class="divide-y divide-[var(--border)]">${pack.doc_types.map(t=>`
        <div class="flex items-center gap-3 py-2.5">
          <button class="${t.required?'bg-[var(--fill-accent)] text-[var(--on-accent)]':'bg-[var(--surface-1)] text-[var(--text-muted)]'} ${SM} shrink-0 w-[52px]" onclick="toggleDocType(${t.id})">${t.required?'필수':'선택'}</button>
          <div class="min-w-0 flex-1"><p class="text-[14px] font-medium truncate">${esc(t.name)}</p>
            <p class="text-[12px] text-[var(--text-muted)] truncate">${esc((t.filename_hints||[]).join(', ')||'힌트 없음')}${t.description?' · '+esc(t.description):''}</p></div>
          <button class="${GS} shrink-0" onclick="delDocType(${t.id})">삭제</button></div>`).join('')}</div>
      <form id="dtform" class="flex gap-2 mt-4 flex-wrap">
        <input name="name" placeholder="유형 이름" required class="${INP} !w-[150px]">
        <label class="flex items-center gap-1.5 text-[13px] font-medium text-[var(--text-secondary)]"><input type="checkbox" name="required" checked class="accent-[var(--fill-accent)] w-4 h-4"> 필수</label>
        <input name="filename_hints" placeholder="파일명 힌트 (쉼표)" class="${INP} !w-[150px]">
        <input name="description" placeholder="설명 (선택)" class="${INP} !w-auto flex-1 min-w-[120px]">
        <button class="${PS}">추가</button></form>`)}
    ${card(h2('파일 탐지 규칙')+
      hint('파일 하나 안에서 VLM이 값·위치를 탐지해요. extract는 값 추출, verify는 pass/fail/uncertain 판정. 규칙을 바꾸면 파일 화면에서 재탐지하세요.')+
      `<div class="divide-y divide-[var(--border)]">${fileRules.map(r=>`
        <div class="flex items-center gap-3 py-2.5">
          ${badge(r.rule_type,r.rule_type==='verify'?'uncertain':'skipped')}
          <span class="text-[13px] text-[var(--text-muted)] w-[130px] shrink-0 truncate">${esc(r.doc_type)}</span>
          <div class="min-w-0 flex-1"><p class="text-[14px] font-medium">${esc(r.field)}${r.sensitive?' '+badge('민감·마스킹','fail'):''}</p>
            ${r.instruction?`<p class="text-[12px] text-[var(--text-muted)] truncate">${esc(r.instruction)}</p>`:''}</div>
          <button class="${r.sensitive?PS:GS} shrink-0" onclick="toggleSensitive(${r.id})" title="민감정보: 값 마스킹 추출 + 증거 crop 저장 안 함">민감</button>
          <button class="${GS} shrink-0" onclick="delRule(${r.id})">삭제</button></div>`).join('')}</div>
      <form id="ruleform" class="flex gap-2 mt-4 flex-wrap">
        <select name="rule_type" class="${INP} !w-[100px]"><option value="extract">extract</option><option value="verify">verify</option></select>
        <input name="doc_type" placeholder="문서 유형 (또는 *)" required class="${INP} !w-[140px]">
        <input name="field" placeholder="필드" required class="${INP} !w-[130px]">
        <input name="instruction" placeholder="설명 (선택)" class="${INP} !w-auto flex-1 min-w-[120px]">
        <button class="${PS}">추가</button></form>`)}
    ${card(h2('종합 검사 규칙 <span class="text-[12px] font-medium text-[var(--text-pro)] bg-[var(--bg-pro)] px-2 py-0.5 rounded-full">제출건 단위 · pro</span>')+
      hint('파일별 추출이 끝난 값들을 놓고 서류를 가로질러 평가해요. 자연어로 쓰면 됩니다. PDF를 다시 읽지 않아요.')+
      `<div class="divide-y divide-[var(--border)]">${subRules.map(r=>`
        <div class="flex items-start gap-3 py-2.5">
          <div class="min-w-0 flex-1"><p class="text-[14px] font-medium">${esc(r.field)}</p>
            <p class="text-[12px] text-[var(--text-muted)]">${esc(r.instruction)}</p></div>
          <button class="${GS} shrink-0" onclick="delRule(${r.id})">삭제</button></div>`).join('')}</div>
      <form id="subruleform" class="mt-4 space-y-2">
        <input name="field" placeholder="규칙 이름 (예: 대표자·서명자 일치)" required class="${INP}">
        <textarea name="instruction" placeholder="규칙 내용을 자연어로 — 무엇을 어떤 기준으로 판정할지" required rows="2" class="${INP}"></textarea>
        <button class="${PS}">종합 규칙 추가</button></form>`)}
  </section></div>`;
  $('#basedate').value=new Date().toISOString().slice(0,10);
  $('#packsel').addEventListener('change',e=>{CURPACK=+e.target.value;viewHome()});
  $('#ruleform').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);
    await api('/api/rules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pack_id:pack.id,rule_type:f.get('rule_type'),doc_type:f.get('doc_type'),field:f.get('field'),instruction:f.get('instruction')})});viewHome()});
  $('#subruleform').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);
    await api('/api/rules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pack_id:pack.id,rule_type:'verify',scope:'submission',doc_type:'종합',field:f.get('field'),instruction:f.get('instruction')})});viewHome()});
  $('#dtform').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);

// ── 파일 스트리밍: 커서 증분 폴링(백엔드) + FIFO 재생 큐(프론트) ──
// LLM 이 빨라져 완료가 폭주해도, 백엔드는 커서 이후 배치만 보내고 큐가 사람 눈 속도로 재생한다.
let PLAYQ=[],PLAYING=false,CURSOR=0,POLLDONE=false,STREAMID=null,SEEN=new Set();
function startStream(id, cursor=0){
  clearInterval(pollTimer);  // orphan 인터벌 방지 (재진입 시 이중 폴링 차단)
  PLAYQ=[];PLAYING=false;CURSOR=cursor;POLLDONE=false;STREAMID=id;SEEN=new Set();
  pollProgress();pollTimer=setInterval(pollProgress,1000);}  // progress 가 가벼워 1초 폴링도 부담 없음
async function pollProgress(){const id=STREAMID;
  let d;try{d=await api(`/api/submissions/${id}/progress?after=${CURSOR}`);}catch(e){return;}
  const cur=$('#livecurrent');
  if(cur)cur.innerHTML=d.current?currentScreen(d.current):(PLAYQ.length||PLAYING?'':'<p class="text-[13px] text-[var(--text-muted)]">문서 준비 중…</p>');
  // 커서는 응답 배치 전체를 반영해 한 번만 전진 (중간에 갱신하면 재진입 시 일부를 건너뛸 수 있음).
  // SEEN 으로 파일 id 중복 push 를 이중 방어한다.
  d.new_files.forEach(f=>{if(SEEN.has(f.file_id))return;SEEN.add(f.file_id);PLAYQ.push(f);});
  if(d.new_files.length)CURSOR=Math.max(CURSOR,...d.new_files.map(f=>f.file_id));
  const qb=$('#qbadge');if(qb)qb.innerHTML=PLAYQ.length>2?badge('대기 '+PLAYQ.length,'processing'):'';
  playLoop();
  if(d.done){POLLDONE=true;maybeFinish();}}
function playLoop(){
  if(PLAYING)return;
  const f=PLAYQ.shift();
  if(!f){maybeFinish();return;}
  PLAYING=true;
  const tally=$('#livetally');if(tally)tally.innerHTML=feedScreen({...f,file_id:f.file_id});
  const qb=$('#qbadge');if(qb)qb.innerHTML=PLAYQ.length>2?badge('대기 '+PLAYQ.length,'processing'):'';
  // 큐가 밀리면 체류시간을 줄여 따라잡되(가속), 최소 350ms 는 보장 — 사람이 각 파일을 인지
  const dwell=PLAYQ.length>5?350:PLAYQ.length>2?700:1400;
  setTimeout(()=>{const lg=$('#livelog');if(lg)lg.insertAdjacentHTML('afterbegin',feedLogRow({...f,file_id:f.file_id}));
    if(tally)tally.innerHTML='';PLAYING=false;playLoop();},dwell);}
function maybeFinish(){
  if(POLLDONE&&!PLAYING&&PLAYQ.length===0){clearInterval(pollTimer);
    if(STREAMID)viewSubmission(STREAMID);}}  // 완료 → 전체 뷰(체크리스트·종합검사·audit)를 한 번만 로드

async function loadAudit(subId){
  const events=await api('/api/submissions/'+subId+'/audit');
  const el=$('#auditlog');if(!el)return;
  const recent=events.slice().reverse().slice(0,30);
  el.innerHTML=events.length?(recent.map(auditRow).join('')
    +(events.length>30?`<p class="text-[12px] text-[var(--text-muted)] py-2">… 외 ${events.length-30}건 (전체 ${events.length}건 보존됨)</p>`:'')):
    '<p class="text-[13px] text-[var(--text-muted)]">아직 이벤트 없음.</p>';}

      <p class="text-[13.5px] font-medium text-[var(--text-warning)]">미등록 유형: ${esc(FD.doc_type||'미상')}</p>
      <p class="text-[12.5px] text-[var(--text-muted)] my-1.5">${esc(FD.doc_type_evidence)}</p>
      <button class="${PS}" onclick="registerDocType()">이 유형을 레지스트리에 등록</button></div>`:'';
  $('#main').innerHTML=`<div class="grid lg:grid-cols-[1fr_440px] gap-5 items-start">
  <section>${pagesHtml||card('<p class="text-[13px] text-[var(--text-muted)]">페이지 이미지 없음 (변환 안 된 파일)</p>')}</section>
  <section class="lg:sticky lg:top-[76px] space-y-5">
    ${card(h2(`탐지 ${dets.length}건 — ${esc(FD.doc_type||'유형 미판별')}`)+unregHtml+
      `<div class="space-y-2.5 max-h-[46vh] overflow-auto pr-1">${detsHtml||'<p class="text-[13px] text-[var(--text-muted)]">탐지된 필드 없음</p>'}</div>
      <button class="${G} w-full mt-3" onclick="suggestRules()" id="sugbtn">이 문서에서 점검할 규칙 제안 받기</button>
      <div id="suggestions" class="space-y-2.5 mt-2.5"></div>`)}
    ${card(h2(`골든셋 확정 ${FD.golden.length?badge('등록됨 · '+FD.golden.length+'필드','golden'):''}`)+
      hint("'맞음' 표시(또는 정정 값 입력)된 탐지가 이 파일의 정답으로 저장돼요.")+
      `<label class="block text-[13px] font-medium text-[var(--text-secondary)] mb-1.5">파일 판정</label>
      <select id="gverdict" class="${INP}"><option value="pass">pass</option><option value="fail">fail</option><option value="uncertain">uncertain</option></select>
      <label class="block text-[13px] font-medium text-[var(--text-secondary)] mt-3 mb-1.5">메모</label>
      <input id="gnote" placeholder="적발 사항 등 (선택)" class="${INP}">
      <button class="${P} w-full mt-4" onclick="saveGolden()">골든셋으로 저장</button>
      <button class="${G} w-full mt-2" onclick="redetect()">현재 규칙으로 재탐지</button>`)}
  </section></div>`;
  if(FD.golden.length){$('#gverdict').value=FD.golden[0].verdict;$('#gnote').value=FD.golden[0].note}}

function focusDet(id){const el=document.getElementById('det'+id);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.style.outline='2px solid var(--border-accent)';setTimeout(()=>el.style.outline='',900)}}
async function feedback(id,fb,cv){const dd=FD.detections.find(x=>x.id===id);
  if(cv===undefined&&dd.feedback===fb)fb='';
  await api('/api/detections/'+id+'/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({feedback:fb,corrected_value:cv??dd.corrected_value})});
  viewFile(FD.id)}
async function saveGolden(){
  const items=FD.detections.filter(dd=>dd.feedback==='correct'||dd.corrected_value)
    .map(dd=>({field:dd.field,expected_value:dd.verdict?dd.verdict:(dd.corrected_value||dd.value),source_detection_id:dd.id}));
  if(!items.length&&!confirm('맞음 표시된 탐지가 없습니다. 판정만 저장할까요?'))return;
  await api('/api/files/'+FD.id+'/golden',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({verdict:$('#gverdict').value,note:$('#gnote').value,items})});
  viewFile(FD.id)}
async function redetect(){if(!confirm('현재 규칙으로 이 파일을 다시 탐지합니다. 피드백 없는 탐지는 교체돼요.'))return;
  await api('/api/files/'+FD.id+'/redetect',{method:'POST'});
  const wait=setInterval(async()=>{const f=await api('/api/files/'+FD.id);if(f.status!=='pending'){clearInterval(wait);viewFile(FD.id)}},2000)}
async function registerDocType(){const hints=prompt('파일명 힌트 (쉼표 구분, 선택)','')??'';
  await api('/api/doc_types',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pack_id:FD.pack_id,name:FD.doc_type,required:false,filename_hints:hints,description:FD.doc_type_evidence})});
  alert('등록됐어요. 재탐지하면 등록 유형으로 판별됩니다.');viewFile(FD.id)}
let SUG=[];
async function suggestRules(){const btn=$('#sugbtn');btn.disabled=true;btn.textContent='VLM이 문서를 읽는 중…';
  try{const r=await api('/api/files/'+FD.id+'/suggest_rules',{method:'POST'});SUG=r.suggestions;
    $('#suggestions').innerHTML=SUG.length?SUG.map((s,i)=>`<div class="rounded-2xl border border-[var(--border)] p-3.5" id="sug${i}">
      <div class="flex items-center justify-between gap-2">
        <span class="flex items-center gap-2">${badge(s.rule_type,s.rule_type==='verify'?'uncertain':'skipped')}<b class="text-[13.5px] font-medium">${esc(s.field)}</b></span>
        <button class="${PS}" onclick="addSuggested(${i})">추가</button></div>
      <p class="text-[12.5px] text-[var(--text-muted)] mt-1.5">${esc(s.instruction)}<br><i>왜: ${esc(s.why)}</i></p></div>`).join('')
      :'<p class="text-[13px] text-[var(--text-muted)]">제안할 규칙이 없대요.</p>'}
  finally{btn.disabled=false;btn.textContent='이 문서에서 점검할 규칙 제안 받기'}}
async function addSuggested(i){const s=SUG[i];
  await api('/api/rules',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pack_id:FD.pack_id,rule_type:s.rule_type,doc_type:s.doc_type,field:s.field,instruction:s.instruction})});
  document.getElementById('sug'+i).style.opacity=.4;document.querySelector('#sug'+i+' button').textContent='추가됨'}
async function delRule(id){if(!confirm('규칙을 삭제할까요?'))return;await api('/api/rules/'+id,{method:'DELETE'});route()}
async function delDocType(id){if(!confirm('문서 유형을 삭제할까요?'))return;await api('/api/doc_types/'+id,{method:'DELETE'});route()}
async function toggleDocType(id){await api('/api/doc_types/'+id+'/toggle',{method:'POST'});route()}
async function toggleSensitive(id){await api('/api/rules/'+id+'/toggle_sensitive',{method:'POST'});route()}
async function newPack(){const name=prompt('새 심사 팩 이름 (예: 2027 창업지원 적격심사)');if(!name)return;
  try{const r=await api('/api/packs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
    CURPACK=r.id;location.hash='#onboard/'+r.id}
  catch(e){alert(e.message)}}

// ── 온보딩: 팩 생성 → 샘플 ZIP → 유형·규칙 일괄 제안 → 사람 확정 → 그 후에야 심사 ──
async function viewOnboard(id){const d=await api('/api/packs/'+id+'/onboarding');
  const p=d.pack,run=d.run;
  $('#crumb').textContent='› 온보딩: '+p.name;
  if(run&&run.status==='processing'){
    const done=run.files.filter(f=>f.doc_type||f.status==='error').length;
    $('#main').innerHTML=card(h2('샘플 서류 파악 중… <span class="text-[13px] font-medium text-[var(--text-accent)]">'+done+'/'+run.files.length+'</span>')+
      hint('파일마다 유형만 분류하고(추출 없음), 파악이 끝나면 유형별로 규칙을 제안받아요.')+
      `<div class="space-y-1">${run.files.map(f=>`<div class="flex items-center gap-2 py-1 text-[13px]">
        ${f.doc_type?'<span class="text-[var(--text-success)] font-medium">✓</span>':f.status==='error'?'<span class="text-[var(--text-danger)] font-medium">✗</span>':'<span class="w-3 h-3 rounded-full border-2 border-[var(--border-accent)] border-t-transparent animate-spin inline-block"></span>'}
        <span class="truncate flex-1">${esc(f.filename)}</span>
        <span class="text-[var(--text-muted)] text-[12px]">${esc(f.doc_type||'')}</span></div>`).join('')||'<p class="text-[13px] text-[var(--text-muted)]">문서 변환 중…</p>'}</div>`);
    pollTimer=setInterval(()=>viewOnboard(id),2500);return}
  if(!run){
    $('#main').innerHTML=card(h2('1단계 — 샘플 ZIP 업로드')+
      hint('이 심사에서 받게 될 서류를 대표하는 샘플 묶음(1~2개 제출건이면 충분)을 올려주세요. AI 가 <b class="font-medium">서류의 전체 집합</b>을 파악하고 유형별 점검 규칙을 제안해요. 이 단계에서는 추출·심사를 하지 않아 비용이 적어요 (파일당 분류 1회 + 유형당 제안 1회).')+
      `<form id="obform" class="space-y-3">
        <input name="zip" type="file" accept=".zip" required class="block w-full text-[13px] text-[var(--text-secondary)] file:mr-3 file:px-4 file:py-2.5 file:rounded-xl file:border-0 file:bg-[var(--bg-accent)] file:text-[var(--text-accent)] file:text-[13px] file:font-medium file:cursor-pointer">
        <button class="${P} w-full py-3">샘플 분석 시작</button></form>`,'max-w-[560px] mx-auto');
    $('#obform').addEventListener('submit',async e=>{e.preventDefault();e.target.querySelector('button').disabled=true;
      await api('/api/packs/'+id+'/onboard',{method:'POST',body:new FormData(e.target)});viewOnboard(id)});
    return}
  // 확정 화면: 파악된 서류 전체 집합 + 유형별 제안 규칙
  const byType={};(run.files||[]).forEach(f=>{if(f.doc_type)(byType[f.doc_type]=byType[f.doc_type]||[]).push(f)});
  const ruleRow=r=>`<div class="flex items-center gap-2.5 py-2 border-b border-[var(--border)] last:border-0">
    ${badge(r.rule_type,r.rule_type==='verify'?'uncertain':'skipped')}
    <div class="min-w-0 flex-1"><p class="text-[13.5px] font-medium">${esc(r.field)}${r.sensitive?' '+badge('민감·마스킹','fail'):''}</p>
      <p class="text-[12px] text-[var(--text-muted)] truncate">${esc(r.instruction)}</p></div>
    <button class="${r.sensitive?PS:GS} shrink-0" onclick="toggleSensitive(${r.id})">민감</button>
    <button class="${GS} shrink-0" onclick="delRule(${r.id})">삭제</button></div>`;
  $('#main').innerHTML=`
  ${p.status==='ready'?card(`<p class="text-[14px] font-medium text-[var(--text-success)]">온보딩 확정 완료 — 이제 <a href="#home" class="underline">홈에서 심사를 시작</a>할 수 있어요.</p>`,'mb-5'):''}
  <div class="grid lg:grid-cols-[420px_1fr] gap-5 items-start">
  <section class="space-y-5">
    ${card(h2('2단계 — 서류 전체 집합 확인 <span class="text-[12px] font-medium text-[var(--text-accent)] bg-[var(--bg-accent)] px-2 py-0.5 rounded-full">'+p.doc_types.length+'종 파악</span>')+
      hint('샘플에서 파악된 유형이에요. 필수↔선택을 조정하고, 잘못 갈라진 유형은 삭제하세요. 누락된 유형은 직접 추가할 수 있어요.')+
      `<div class="divide-y divide-[var(--border)]">${p.doc_types.map(t=>`
        <div class="flex items-center gap-3 py-2.5">
          <button class="${t.required?'bg-[var(--fill-accent)] text-[var(--on-accent)]':'bg-[var(--surface-1)] text-[var(--text-muted)]'} ${SM} shrink-0 w-[52px]" onclick="toggleDocType(${t.id})">${t.required?'필수':'선택'}</button>
          <div class="min-w-0 flex-1"><p class="text-[14px] font-medium truncate">${esc(t.name)}</p>
            <p class="text-[12px] text-[var(--text-muted)]">샘플 ${(byType[t.name]||[]).length}건</p></div>
          <button class="${GS} shrink-0" onclick="delDocType(${t.id})">삭제</button></div>`).join('')}</div>
      <form id="obdtform" class="flex gap-2 mt-4">
        <input name="name" placeholder="유형 직접 추가" required class="${INP} flex-1">
        <button class="${PS} shrink-0">추가</button></form>`)}
    ${card(`<button class="${P} w-full py-3" onclick="finalizePack(${p.id})">온보딩 확정 — 심사 시작 가능하게</button>
      <p class="text-[12px] text-[var(--text-muted)] mt-2.5">확정하면 이 서류 집합·규칙 기준으로 심사가 열려요. 확정 후에도 홈에서 수정할 수 있어요.</p>`)}
  </section>
  <section>
    ${card(h2('3단계 — 유형별 제안 규칙 검토')+
      hint('AI 가 샘플을 읽고 제안한 점검 항목이에요. 필요 없는 건 삭제하고, 개인정보(주민번호·계좌번호 등)는 <b class="font-medium">민감</b>을 켜세요 — 값이 마스킹돼 저장되고 증거 이미지도 남기지 않아요.')+
      Object.entries(byType).map(([type])=>{
        const rs=p.rules.filter(r=>r.doc_type===type);
        return `<p class="text-[13px] font-medium mt-4 mb-1">${esc(type)} <span class="text-[var(--text-muted)] font-normal">(${rs.length})</span></p>`+
          (rs.map(ruleRow).join('')||'<p class="text-[12px] text-[var(--text-muted)]">제안 없음</p>')}).join(''))}
  </section></div>`;
  const obdt=$('#obdtform');
  if(obdt)obdt.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);
    await api('/api/doc_types',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pack_id:p.id,name:f.get('name'),required:true,filename_hints:'',description:''})});viewOnboard(id)});}
async function finalizePack(id){
  try{await api('/api/packs/'+id+'/finalize',{method:'POST'});CURPACK=id;location.hash='#home'}
  catch(e){alert(e.message)}}
async function checkFeedback(id,fb,subId){await api('/api/checks/'+id+'/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({feedback:fb})});viewSubmission(subId)}
async function runChecks(subId){const btn=$('#checkbtn');btn.disabled=true;btn.textContent='pro가 추출값을 검토하는 중…';
  await api('/api/submissions/'+subId+'/check',{method:'POST'});
  setTimeout(()=>viewSubmission(subId),12000)}

async function viewGolden(){$('#crumb').textContent='› 골든셋 검사';
  const runs=await api('/api/golden_runs');
  const runItem=r=>`<div class="rounded-2xl border border-[var(--border)] hover:border-[var(--border-accent)] p-4 cursor-pointer transition" onclick="showRun(${r.id})">
    <div class="flex items-center justify-between"><b class="text-[14px] font-medium">검사 #${r.id}</b>
      ${r.status==='done'?badge(`${r.matched}/${r.total} 일치`,r.matched===r.total?'pass':'fail'):badge(r.status,r.status)}</div>
    <p class="text-[12px] text-[var(--text-muted)] mt-1">${esc((r.created_at||'').slice(0,19).replace('T',' '))}</p></div>`;
  $('#main').innerHTML=`<div class="grid lg:grid-cols-[400px_1fr] gap-5 items-start">
  <section>${card(h2('골든셋 검사 <span class="text-[12px] font-medium text-[var(--text-pro)] bg-[var(--bg-pro)] px-2 py-0.5 rounded-full">#2 골든 러너</span>')+
    hint('검토 화면에서 확정한 정답 파일을 <b class="font-medium">현재 규칙으로 다시 탐지</b>해 정답과 대조해요. 규칙·프롬프트를 바꾼 뒤 돌리면 회귀를 바로 잡아냅니다. 규칙이 같으면 캐시라 비용 0.')+
    `<button class="${P} w-full py-3" onclick="startGolden()" id="grunbtn">지금 검사 실행</button>
    <h2 class="text-[15px] font-medium mt-5 mb-2.5">실행 이력</h2>
    <div id="runlist" class="space-y-2.5">${runs.map(runItem).join('')||'<p class="text-[13px] text-[var(--text-muted)]">아직 실행한 검사가 없어요.</p>'}</div>`)}</section>
  <section>${card(`<div id="rundetail"><p class="text-[13px] text-[var(--text-muted)]">검사를 실행하거나 이력을 선택하면 결과가 여기 표시돼요.</p></div>`)}</section></div>`;
  if(runs[0])showRun(runs[0].id)}
async function showRun(id){const d=await api('/api/golden_runs/'+id);const el=$('#rundetail');if(!el)return;
  if(d.status==='running'){el.innerHTML='<p class="text-[13px] text-[var(--text-accent)] font-medium animate-pulse">검사 실행 중… (규칙이 바뀐 파일은 VLM 재호출)</p>';
    clearInterval(pollTimer);pollTimer=setInterval(()=>showRun(id),2500);return}
  clearInterval(pollTimer);
  if(d.status==='error'){el.innerHTML=`<p class="text-[13px] text-[var(--text-danger)]">실행 실패: ${esc((d.results[0]||{}).error||'')}</p>`;return}
  const byFile={};(d.results||[]).forEach(r=>{(byFile[r.filename]=byFile[r.filename]||[]).push(r)});
  const pct=d.total?Math.round(d.matched/d.total*100):0;
  el.innerHTML=h2(`검사 #${d.id} 결과 ${badge(`${d.matched}/${d.total} 일치 (${pct}%)`,d.matched===d.total?'pass':'fail')}`)+
    Object.entries(byFile).map(([fn,rows])=>`<div class="rounded-2xl border border-[var(--border)] p-4 mt-3">
      <p class="text-[13.5px] font-medium mb-2">${esc(fn)}</p>
      <table class="w-full text-[12.5px]"><thead><tr class="text-left text-[var(--text-muted)]"><th class="w-6 pb-1.5"></th><th class="pb-1.5">필드</th><th class="pb-1.5">정답</th><th class="pb-1.5">이번 탐지</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="${r.ok?'':'bg-[var(--bg-danger)]/40'}"><td class="py-1">${r.ok?'<span class="text-[var(--text-success)] font-medium">✓</span>':'<span class="text-[var(--text-danger)] font-medium">✗</span>'}</td>
        <td class="py-1 font-medium pr-2">${esc(r.field)}</td>
        <td class="py-1 font-mono text-[var(--text-secondary)] pr-2">${esc(r.expected)}</td>
        <td class="py-1 font-mono text-[var(--text-secondary)]">${r.got.map(esc).join('<br>')||'<span class="text-[var(--text-muted)]">(미탐지)</span>'}</td></tr>`).join('')}
      </tbody></table></div>`).join('')}
async function startGolden(){const btn=$('#grunbtn');btn.disabled=true;
  try{const r=await api('/api/golden_runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pack_id:1})});
    showRun(r.id);const runs=await api('/api/golden_runs');
    $('#runlist').innerHTML=runs.map(r2=>`<div class="rounded-2xl border border-[var(--border)] p-4 cursor-pointer" onclick="showRun(${r2.id})">
      <div class="flex items-center justify-between"><b class="text-[14px] font-medium">검사 #${r2.id}</b>
        ${r2.status==='done'?badge(`${r2.matched}/${r2.total} 일치`,r2.matched===r2.total?'pass':'fail'):badge(r2.status,r2.status)}</div>
      <p class="text-[12px] text-[var(--text-muted)] mt-1">${esc((r2.created_at||'').slice(0,19).replace('T',' '))}</p></div>`).join('')}
  catch(e){alert(e.message)}
  finally{btn.disabled=false}}
route();
</script></body></html>
